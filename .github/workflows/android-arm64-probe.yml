name: Android ARM64 NDK probe

on:
  push:
    branches: ["android/arm64-phase1"]
    paths:
      - "android/arm64-probe/**"
      - ".github/workflows/android-arm64-probe.yml"
  pull_request:
    paths:
      - "android/arm64-probe/**"
      - ".github/workflows/android-arm64-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-and-build-arm64:
    name: Configure and compile arm64-v8a Vulkan probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.31.6"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"

      - name: Configure for Android arm64-v8a
        run: |
          cmake -S android/arm64-probe -B out/android-arm64-probe -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile native shared library
        run: cmake --build out/android-arm64-probe --verbose

      - name: Upload ARM64 probe library
        uses: actions/upload-artifact@v4
        with:
          name: legacyrecomp-android-arm64-probe
          path: out/android-arm64-probe/liblegacyrecomp_android_arm64_probe.so
          if-no-files-found: error
